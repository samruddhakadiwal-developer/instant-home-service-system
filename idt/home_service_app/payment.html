<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Payment</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .checkout-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #10b981, #059669);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }

        .header h1 { margin: 0; font-size: 24px; font-weight: 700; }
        .amount { font-size: 48px; font-weight: 800; margin: 10px 0 0; }
        
        .content { padding: 30px; }

        .method-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .method-btn {
            border: 2px solid #e2e8f0;
            background: white;
            padding: 15px;
            border-radius: 16px;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .method-btn.active {
            border-color: #10b981;
            background: #ecfdf5;
            color: #059669;
        }

        .input-group { margin-bottom: 20px; display: none; }
        .input-group.active { display: block; }
        
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #1e293b; font-size: 14px;}
        .input-group input {
            width: 100%; padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px; font-size: 15px; font-family: inherit;
            box-sizing: border-box;
        }

        .btn-pay {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            background: #1e293b;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .btn-pay:hover { background: #0f172a; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn-pay:active { transform: translateY(0); }

        .success-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }

        .success-overlay.show { opacity: 1; pointer-events: all; }
        .success-icon { font-size: 80px; margin-bottom: 20px; animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .success-text { font-size: 24px; font-weight: 800; color: #10b981; }

        @keyframes scaleIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

    </style>
</head>
<body>

    <div class="checkout-card">
        <div class="header">
            <h1>Total Due</h1>
            <div class="amount" id="price-display">₹...</div>
            <div style="font-size:14px; opacity:0.8; margin-top:5px;" id="job-title-display">Loading job details...</div>
        </div>
        
        <div class="content">
            <h3 style="margin-top:0; color:#1e293b; font-size:16px;">Select Payment Method</h3>
            
            <div class="method-select">
                <button class="method-btn active" onclick="selectMethod('upi')">UPI</button>
                <button class="method-btn" onclick="selectMethod('card')">Card</button>
            </div>

            <div class="input-group active" id="upi-inputs">
                <label>Enter UPI ID</label>
                <input type="text" placeholder="example@okhdfcbank">
            </div>

            <div class="input-group" id="card-inputs">
                <label>Card Number</label>
                <input type="text" placeholder="0000 0000 0000 0000" style="margin-bottom:10px;">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <input type="text" placeholder="MM/YY">
                    <input type="text" placeholder="CVV">
                </div>
            </div>

            <button class="btn-pay" onclick="processPayment()">Pay Now</button>
        </div>

        <div class="success-overlay" id="success-screen">
            <div class="success-icon">✅</div>
            <div class="success-text">Payment Successful!</div>
            <p style="color:#64748b; margin-top:10px;">Redirecting back to dashboard...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('job_id');
        let currentToken = localStorage.getItem('authToken');

        async function fetchJobDetails() {
            if(!jobId || !currentToken) return;
            try {
                const res = await fetch(`/service-requests/${jobId}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                if(res.ok) {
                    const data = await res.json();
                    document.getElementById('price-display').textContent = `₹${data.estimated_price || 0}`;
                    document.getElementById('job-title-display').textContent = data.title;
                }
            } catch (e) { console.error(e); }
        }

        fetchJobDetails();

        function selectMethod(method) {
            document.querySelectorAll('.method-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('upi-inputs').classList.remove('active');
            document.getElementById('card-inputs').classList.remove('active');
            
            if(method === 'upi') document.getElementById('upi-inputs').classList.add('active');
            if(method === 'card') document.getElementById('card-inputs').classList.add('active');
        }

        async function processPayment() {
            const btn = document.querySelector('.btn-pay');
            btn.textContent = 'Processing...';
            btn.style.opacity = '0.7';

            try {
                // Send API request to mark as paid
                const res = await fetch(`/service-requests/${jobId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({ is_paid: true })
                });

                if(res.ok) {
                    setTimeout(() => {
                        document.getElementById('success-screen').classList.add('show');
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 3000);
                    }, 1000);
                } else {
                    alert("Failed to process payment.");
                    btn.textContent = 'Pay Now';
                    btn.style.opacity = '1';
                }
            } catch(e) {
                alert("Network error.");
                btn.textContent = 'Pay Now';
                btn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
